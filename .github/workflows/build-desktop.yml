name: Build desktop installers

# Produces a real native Windows installer (.exe / .msi) for the desktop tier.
#
# The desktop application is a Java Swing program. Turning it into a native
# Windows executable requires `jpackage`, which ships with JDK 17+ but only
# runs on the operating system it targets. Rather than hand out a wrapper that
# still needs Java installed, this workflow bundles a Java runtime into the
# installer so end users need nothing at all.
#
# Run it from the Actions tab ("Run workflow"), or push a tag like v3.0.0.
# The finished installers appear as downloadable artifacts on the run page.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows:
    name: Windows installer (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build the application jar
        run: mvn -B -q clean package -DskipTests

      - name: Stage the jar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          $jar = Get-ChildItem target -Filter "*.jar" |
                 Where-Object { $_.Name -notmatch "sources|javadoc|original" } |
                 Select-Object -First 1
          if (-not $jar) { throw "No jar produced by the Maven build." }
          Copy-Item $jar.FullName "staging/FEMZYK-Fleet-Management.jar"
          Get-Item "staging/FEMZYK-Fleet-Management.jar" | Format-List Name, Length

      - name: Build the native installer
        shell: pwsh
        run: |
          # --type exe        single double-clickable installer
          # --win-console     keep a console so start-up errors are visible
          # --win-shortcut    add Start-menu and desktop entries
          # --win-menu        register in the Start menu
          # No --runtime-image: jpackage bundles the running JDK's runtime.
          jpackage `
            --type exe `
            --name "FEMZYK Fleet Management" `
            --app-version "2.0.0" `
            --input staging `
            --main-jar "FEMZYK-Fleet-Management.jar" `
            --main-class "com.femzyk.fleetmanagement.FleetManagementApplication" `
            --description "FEMZYK Enterprise Fleet and Transport Management System" `
            --vendor "FEMZYK" `
            --win-console `
            --win-shortcut `
            --win-menu `
            --win-menu-group "FEMZYK" `
            --dest dist

      - name: Show what was produced
        shell: pwsh
        run: Get-ChildItem -Recurse dist | Format-Table FullName, Length

      - uses: actions/upload-artifact@v4
        with:
          name: femzyk-fleet-windows-installer
          path: dist/*
          if-no-files-found: error
          retention-days: 30
